<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0E0F15">
<title>SIYOMA · FIRE ENERGY DRAGON</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
<style>
  html,body{margin:0;height:100%;background:#0E0F15;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
  #ar{position:fixed;inset:0}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;
    background:radial-gradient(120% 80% at 50% 30%,#1A2236 0%,#0E0F15 60%);z-index:20;transition:opacity .5s}
  .screen.hide{opacity:0;pointer-events:none}
  .logo{width:180px;margin-bottom:28px}
  .dragon{width:150px;filter:drop-shadow(0 0 22px #00B9F0aa);animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px)}}
  h1{font-size:22px;margin:22px 0 8px;letter-spacing:.02em}
  p{color:#AEB7C6;font-size:15px;line-height:1.45;margin:0 0 26px;max-width:320px}
  .btn{background:linear-gradient(180deg,#FFD21F,#F7931E);color:#0E0F15;border:0;border-radius:14px;padding:16px 34px;font-size:17px;font-weight:700;letter-spacing:.02em;box-shadow:0 8px 30px #F7931E55}
  .brand{position:absolute;bottom:22px;font:700 13px/1.1 sans-serif;letter-spacing:.14em;color:#ffffff88}
  .brand b{color:#FFD21F}
  #hint{position:fixed;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom));text-align:center;z-index:10;pointer-events:none;transition:opacity .4s}
  #hint span{background:#0E0F15cc;border:1px solid #00B9F055;border-radius:20px;padding:10px 16px;font-size:14px;color:#DDE6F2}
  #hint.hide{opacity:0}
  #links{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));display:none;flex-wrap:wrap;gap:10px;justify-content:center;z-index:11;padding:0 16px}
  #links.show{display:flex}
  #links a{background:#0E0F15dd;border:1px solid #FFD21F88;color:#fff;text-decoration:none;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:600}
  #err{display:none}
</style>
</head>
<body>
<div id="ar"></div>
<div id="start" class="screen">
  <img class="logo" src="assets/logo.png" alt="SIYOMA">
  <img class="dragon" src="assets/dragon.png" alt="">
  <h1>Оживите свой сертификат</h1>
  <p>Нажмите кнопку и наведите камеру на сертификат целиком — дракон выйдет из бумаги.</p>
  <button class="btn" id="go">🔥 Оживить дракона</button>
  <div class="brand">FIRE ENERGY DRAG<b>ON</b></div>
</div>
<div id="err" class="screen">
  <h1>Нет доступа к камере</h1>
  <p>Разрешите доступ к камере в настройках браузера и откройте страницу снова.</p>
  <button class="btn" onclick="location.reload()">Попробовать ещё раз</button>
</div>
<div id="hint" class="hide"><span>Наведите камеру на сертификат целиком</span></div>
<div id="links"></div>
<script type="module" src="app.js"></script>
</body>
</html>
